[workspace]
members = [
  "crates/identity-core",
  "crates/capability-policy",
  "crates/mesh",
  "crates/node-daemon",
  "examples/rust-agent",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
agent-capability-policy = { path = "crates/capability-policy" }
agent-identity-core = { path = "crates/identity-core" }
agent-mesh = { path = "crates/mesh" }
aes-gcm = "0.10"
argon2 = "0.5"
axum = "0.7"
base64 = "0.22"
hex = "0.4"
libp2p = { version = "0.53", features = ["autonat", "ed25519", "gossipsub", "identify", "kad", "macros", "noise", "tcp", "tokio", "yamux"] }
rand = "0.8"
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.10"
tokio = { version = "1.37", features = ["full"] }
tower-http = { version = "0.5", features = ["trace"] }
